<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>Sand plate</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="plate-layer" class="layer" aria-hidden="true"></canvas>
    <canvas id="guide-layer" class="layer" aria-hidden="true"></canvas>
    <canvas id="sand-layer" class="layer" aria-hidden="true"></canvas>
    <canvas
      id="ring-layer"
      class="layer interactive"
      tabindex="0"
      role="application"
      aria-label="Sand plate. Drag through the sand to play. Tap to strike. Drag or tap the ring to play an overtone of the root note. Arrow keys change the overtone."
    ></canvas>

    <header class="top">
      <nav id="crumb" class="crumb" aria-label="Breadcrumb">
        <a href="../index.html">Prototypes</a>
        <span aria-hidden="true">/</span>
        <span>Sand plate</span>
      </nav>
      <p id="readout" class="readout" aria-live="polite">
        <span id="readout-name" class="readout-name">Overtone 6</span><span class="readout-sep readout-sep-first" aria-hidden="true"> · </span><span id="readout-meaning" class="readout-meaning">two octaves + fifth</span><span class="readout-sep" aria-hidden="true"> · </span><span id="readout-frequency">660 Hz</span>
      </p>
    </header>

    <button id="start" class="start" type="button">Start</button>

    <div id="dock" class="dock">
      <div class="hint">
        <p>Drag through the sand to play.</p>
        <p>The ring plays the notes hidden inside the root note. Each one shakes the plate into its own figure.</p>
      </div>
      <section class="strip" aria-label="Controls">
        <div class="field">
          <span class="field-label">Second</span>
          <div class="segmented" role="group" aria-label="Second string" data-control="second">
            <button type="button" data-value="pa">Pa <small>3/2</small></button>
            <button type="button" data-value="ma">Ma <small>4/3</small></button>
          </div>
        </div>
        <button id="overtone" class="toggle" type="button" aria-pressed="true">Overtone</button>
        <button id="breath" class="toggle" type="button" aria-pressed="false">Breath</button>
      </section>
    </div>

    <p id="notice" class="notice" role="status" hidden></p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
