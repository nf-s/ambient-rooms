<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />
    <title>Still water</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <canvas id="water" aria-label="Water surface"></canvas>
    <a class="back" id="back" href="../index.html">Prototypes</a>
    <p class="fallback" id="fallback" hidden></p>

    <div class="start-layer" id="start-layer">
      <button class="start" id="start" type="button">Start</button>
    </div>

    <div class="hud" id="hud" aria-hidden="true" inert>
      <p class="hint">Drag stones into the water · Drag through the water to make them ring</p>
      <div class="strip">
        <div class="field field-wide">
          <span class="label" id="sound-label">Sound</span>
          <div class="segmented" id="sound" role="group" aria-labelledby="sound-label"></div>
        </div>
      </div>
    </div>
  </body>
</html>
